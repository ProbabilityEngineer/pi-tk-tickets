name: Publish Pi ticket packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - pi-tk-tickets
          - pi-tickets-legacy

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Validate and publish pi-tk-tickets
        if: inputs.package == 'pi-tk-tickets'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          npm ci
          npm run build --if-present
          npm run lint --if-present
          npm publish --access public --provenance
      - name: Publish legacy migration notice
        if: inputs.package == 'pi-tickets-legacy'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: legacy/pi-tickets
        run: |
          if [ -n "$NPM_TOKEN" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          npm publish --access public --provenance
          npm deprecate 'pi-tickets@*' 'Renamed to pi-tk-tickets; install with: pi install npm:pi-tk-tickets'
